
[project]
name = "particleflow-ort-gh200"
version = "3.1.0"
requires-python = "==3.13.*"

dependencies = [
    # Full ParticleFlow dependency list from root.
    "particleflow",

    # GH200 PyTorch CUDA 13
    "torch==2.9.1+cu130",

    # Matching torchvision
    "torchvision==0.24.1",

    # FlashAttention 3 ONLY
    "flash-attn-3==3.0.1",

    # ARM64 source build
    "torch-scatter==2.1.2",

    # ONNX Runtime
    "onnxruntime-gpu==1.29.0",

    # Build tools
    "setuptools",
    "wheel",
    "packaging",
    "ninja",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
particleflow = { path = "../..", editable = true }

torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
flash-attn-3 = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
torch-scatter = [
    "torch==2.9.1+cu130",
]
