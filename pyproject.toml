
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "particleflow"
version = "3.1.0"

authors = [
    { name = "Joosep Pata", email = "joosep.pata@cern.ch" },
    { name = "Farouk Mokhtar" },
    { name = "Eric Wulff" },
    { name = "Javier Duarte" },
]

description = "Machine Learning for Particle Flow Reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache Software License" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "array-record~=0.8.3",
    "autopep8",
    "awkward",
    "boost_histogram",
    "click",
    "comet-ml",
    "fastjet",
    "fsspec",

    # TFDS imports this backport even on Python 3.11.
    "importlib-resources",

    "jupyter",
    "jupyter-book>=2.1.6",
    "keras",
    "keras-tuner",
    "matplotlib",
    "mlcroissant",
    "mplhep",
    "networkx",
    "notebook",
    "numba",
    "numpy",
    "onnx",
    "onnxscript",
    "pandas",
    "papermill",
    "plotly",
    "pre-commit",
    "protobuf~=5.28.3",
    "psutil",

    # Apache Beam compatibility
    "pyarrow~=18.1.0; sys_platform == 'linux'",

    # macOS mutex compatibility
    "pyarrow~=22.0.0; sys_platform == 'darwin'",

    "pydantic",
    "pytest",
    "ray[tune]",
    "scikit-learn",
    "scikit-optimize",
    "scipy",
    "seaborn",
    "setGPU",
    "snakemake",
    "tensorboard",
    "tensorflow~=2.20.0",
    "tensorflow-datasets~=4.9.9",
    "tensorflow-metadata~=1.17.3",

    # GH200 environment controls the exact CUDA build.
    "torch>=2.9,<3",
    "torchvision",
    "torch_runstats",

    # GH200 builds this separately with CUDA 13.
    # Other environments use their own compatible build.
    "torch-scatter; platform_machine != 'aarch64'",

    "tqdm",
    "uproot",
    "umap-learn",
    "vector",
    "zenodo_get",
    "huggingface_hub",

    # Dataset preparation
    "apache_beam~=2.71.0; sys_platform == 'linux'",

    # CUDA 12.4 spconv has no compatible GH200 ARM64 wheel.
    "spconv-cu124; sys_platform == 'linux' and platform_machine == 'x86_64'",

    "addict",
    "timm",
    "colorhash",

    # No FlashAttention 2 dependency.
    # FlashAttention 3 is installed by envs/ort-gh200.

    "colliderml>=0.4.2",
]

[project.scripts]
mlpf = "mlpf.pipeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [
    "tests*",
    "notebooks*",
    "images*",
    "docs*",
    "scripts*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.ruff]
extend-exclude = ["mlpf/data/key4hep/gen"]
target-version = "py311"

[tool.ruff.lint.mccabe]
max-complexity = 25
